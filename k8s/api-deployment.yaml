apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: fase1
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: bestsellers
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: bestsellers
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000        # kubelet faz chown do PVC para GID 1000 no attach
      containers:
        - name: api
          image: pagottoo/bestsellers-api:142243
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: bestsellers-config
                  key: LOG_LEVEL
            - name: DATA_DIR
              value: /var/cache/bestsellers
          volumeMounts:
            - name: cache
              mountPath: /var/cache/bestsellers
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: api-cache
