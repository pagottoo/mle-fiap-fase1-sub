services:
  api:
    build: ./api
    image: bestsellers-api:local
    container_name: bestsellers-api
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: INFO

  dashboard:
    build: ./dashboard
    image: bestsellers-dashboard:local
    container_name: bestsellers-dashboard
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
